  <style>
    :root {
      --bg: #f3efe6;
      --surface: #fffdf8;
      --fg: #1c1915;
      --muted: #746c62;
      --line: #e4dccf;
      --primary: #1b6b45;
      --primary-fg: #f7fbf8;
      --tint: #e7f3ec;
      --sun: #8c3d32;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    }
    main { max-width: 32rem; margin: 0 auto; padding: 1.5rem 1rem 7rem; }
    header { display: block; margin-bottom: 0.75rem; }
    h1 { display: flex; flex-direction: row; align-items: flex-start; gap: 0.4rem; margin: 0 0 0.6rem; font-size: 1.5rem; }
    h1 [data-ko] { width: auto; flex: 0 0 auto; }
    .ver { color: var(--primary); font-size: 1rem; line-height: 1.5rem; }
    .muted { color: var(--muted); font-size: 0.875rem; margin: 0; }
    .month { display: flex; align-items: center; justify-content: space-between; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 0.25rem; margin-bottom: 0.75rem; }
    .month p { flex: 1; text-align: center; font-size: 1.125rem; font-weight: 700; margin: 0; }
    button, input { font: inherit; }
    .icon {
      width: 2.75rem; height: 2.75rem; border: 0; background: transparent; border-radius: 999px; cursor: pointer;
    }
    label.field { display: flex; flex-direction: column; gap: 0.25rem; margin-bottom: 0.5rem; }
    label.field span { font-size: 0.875rem; font-weight: 600; }
    .guide, .notice {
      margin: 0.35rem 0 0.6rem; padding: 0.55rem 0.7rem; border-radius: 0.75rem;
      background: #8c3d32; color: #fffdf8; font-size: 0.95rem; font-weight: 700; line-height: 1.35;
    }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
    input[type="text"], input[type="tel"], input[type="number"] {
      height: 2.75rem; border: 1px solid var(--line); background: var(--surface); border-radius: 0.75rem; padding: 0 0.75rem; width: 100%;
    }
    .sec { border-radius: 0.9rem; padding: 0.65rem 0.7rem 0.2rem; margin-bottom: 0.55rem; }
    .sec h3 { margin: 0 0 0.45rem; font-size: 0.95rem; }
    .sec.type { background: #e7f3ec; border: 2px solid #1b6b45; }
    .sec.type h3 { color: #145c38; }
    .sec.time { background: #fff4d6; border: 2px solid #9a6b12; }
    .sec.time h3 { color: #7a5208; }
    .sec.extra { background: #f8e8e4; border: 2px solid #8c3d32; }
    .sec.extra .choice.on { border-color: #8c3d32; background: #fffdf8; color: #8c3d32; }
    .day-grid { display: grid; gap: 0.5rem; }
    @media (orientation: landscape) and (max-height: 520px) {
      main {
        max-width: none; display: grid;
        grid-template-columns: minmax(220px, 320px) minmax(0, 1fr);
        column-gap: 0.7rem; padding: 0.4rem 0.55rem 3.6rem; align-items: start;
      }
      header, .month, .topfields, .notice, .reset, .summary { grid-column: 1; }
      .cal { grid-column: 2; grid-row: 1 / span 12; margin: 0; }
      header { margin-bottom: 0.25rem; }
      h1 { font-size: 1.15rem; }
      header .muted { display: none; }
      .month { margin-bottom: 0.3rem; }
      .icon { width: 2.1rem; height: 2.1rem; }
      label.field { margin-bottom: 0.25rem; }
      input[type="text"], input[type="tel"], input[type="number"] { height: 2.15rem; }
      .day { min-height: 2.35rem; padding: 0.15rem; }
      .wd { padding: 0.2rem 0; }
      .reset { height: 2.2rem; margin-bottom: 0.35rem; }
      .sheet { width: min(52rem, 100%); }
      .day-grid { grid-template-columns: 1fr 1fr; }
      .choice, .hours { min-height: 2.2rem; margin-bottom: 0.35rem; }
    }
    .summary { font-size: 0.875rem; line-height: 1.5rem; color: var(--muted); margin: 0 0 0.75rem; }
    .cal { border: 1px solid var(--line); background: var(--surface); border-radius: 1rem; padding: 0.5rem; margin: 0 0 0.75rem; }
    .grid { display: grid; grid-template-columns: repeat(7, 1fr); }
    .wd { text-align: center; font-size: 0.75rem; font-weight: 600; padding: 0.5rem 0; color: var(--muted); }
    .wd.sun { color: var(--sun); }
    .day { min-width: 0; min-height: 4.25rem; border: 0; background: transparent; border-radius: 0.75rem; text-align: left; padding: 0.25rem; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; overflow: hidden; }
    .day.on { background: var(--tint); }
    .day.today { box-shadow: inset 0 0 0 1px var(--primary); }
    .day b { font-size: 0.875rem; }
    .day b.sun { color: var(--sun); }
    .day .type { color: var(--primary); font-size: 0.75rem; font-weight: 600; }
    .day .sub { color: var(--muted); font-size: 0.7rem; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .send {
      position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; padding: 0 1rem 1rem;
    }
    .send #open-send, .primary {
      width: min(32rem, 100%); height: 3rem; border: 0; border-radius: 999px; background: var(--primary); color: var(--primary-fg);
      font-weight: 600; cursor: pointer;
    }
    .reset {
      width: min(32rem, 100%); height: 2.75rem; border: 1px solid var(--line); border-radius: 999px;
      background: var(--surface); color: var(--fg); font-weight: 600; cursor: pointer; margin: 0 0 0.75rem;
    }
    .sheet-bg { position: fixed; inset: 0; background: rgba(28, 25, 21, 0.4); display: flex; align-items: flex-end; justify-content: center; }
    .sheet {
      width: min(32rem, 100%); max-height: 100dvh; overflow: auto; background: var(--surface);
      border: 1px solid var(--line); border-radius: 1.5rem 1.5rem 0 0; padding: 1rem 1rem 1.5rem;
    }
    .sheet h2 { margin: 0; font-size: 1.125rem; }
    .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
    .choice, .hours {
      width: 100%; min-height: 2.75rem; border: 1px solid var(--line); background: var(--surface); border-radius: 0.75rem;
      text-align: left; padding: 0 0.75rem; margin-bottom: 0.5rem; cursor: pointer;
    }
    .choice.on { border-color: var(--primary); background: var(--tint); color: var(--primary); }
    .hours { display: flex; align-items: center; justify-content: space-between; cursor: default; }
    .hours input { width: 5rem; border: 0; background: transparent; text-align: right; font-weight: 600; }
    #hours { width: 12rem; font-weight: 400; }
    .hours:disabled, .hours.off { opacity: 0.4; }
    .confirm { width: 100%; height: 3rem; border: 0; border-radius: 0.75rem; background: var(--primary); color: var(--primary-fg); font-weight: 600; margin-top: 1rem; cursor: pointer; }
    .confirm:disabled { opacity: 0.4; }
    .ghost { width: 100%; height: 2.75rem; border: 0; background: transparent; color: var(--muted); margin-top: 0.5rem; cursor: pointer; }
    .err { color: var(--sun); font-size: 0.875rem; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 0.75rem; }
    .actions button { height: 3rem; border-radius: 0.75rem; font-weight: 600; cursor: pointer; }
    .kakao { border: 0; background: var(--primary); color: var(--primary-fg); }
    .sms { border: 1px solid var(--line); background: var(--surface); }
    img.preview { width: 100%; border: 1px solid var(--line); border-radius: 0.75rem; }
    select {
      height: 2.75rem; width: 100%; border: 1px solid var(--line); background: var(--surface);
      border-radius: 0.75rem; padding: 0 0.5rem;
    }
    .tr { display: block; margin-top: 0.1rem; font-size: 0.75rem; font-weight: 500; line-height: 1.25; color: #5c564c; }
    .notice .tr, .reset .tr, #open-send .tr { color: inherit; opacity: 0.92; }
    [data-ko] { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.25; }
    h1[data-ko], .notice[data-ko], .reset[data-ko], #open-send[data-ko] { align-items: center; }
    .choice { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

    };

      "이 날짜 지우기": "ဒီရက်ကို ဖျက်ပါ",
      "교육(2인 근무 교육만 해당)": "လေ့ကျင့်ရေး (၂ ယောက် တာဝန်သာ)",
      "수습": "အစမ်းခန့်",

    };
    function tr(ko) {
      const pack = state.lang === "vi" ? VI : state.lang === "my" ? MY : null;
      return pack && pack[ko] ? pack[ko] : "";
    }
    function labelHtml(ko) {
      const extra = tr(ko);
      return extra ? ko + '<span class="tr">' + extra + "</span>" : ko;
    }
    function applyLang() {
      document.querySelectorAll("[data-ko]").forEach((el) => { el.innerHTML = labelHtml(el.getAttribute("data-ko")); });
    }
    const now = new Date();
    const state = {
      year: now.getFullYear(),
      month: now.getMonth() + 1,
      phone: localStorage.getItem("work-log-manager-phone") || "",
      worker: localStorage.getItem("work-log-worker-name") || "",
      place: localStorage.getItem("work-log-store") || "",
      months: Number(localStorage.getItem("work-log-worker-months")) || 0,
      slot: localStorage.getItem("work-log-shift") || "",
      lang: localStorage.getItem("work-log-lang") || "",
      store: {},
      picked: null,
      draft: null,
    };
    try { state.store = JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); } catch { state.store = {}; }
    const today = new Date();
    const todayKey = today.getFullYear() + "-" + (today.getMonth() + 1) + "-" + today.getDate();

    const phoneEl = document.getElementById("phone");
    const workerEl = document.getElementById("worker");
    const placeEl = document.getElementById("place");
    const monthsEl = document.getElementById("months");
    const startEl = document.getElementById("start");
    const endEl = document.getElementById("end");
    const langEl = document.getElementById("lang");
    function timeOptions() {
      const list = [""];
      for (let hour = 0; hour < 24; hour += 1) {
        list.push(String(hour).padStart(2, "0") + ":00");
        list.push(String(hour).padStart(2, "0") + ":30");
      }
      list.push("24:00");
      return list;
    }
    function snapTime(text) {
      const match = String(text || "").match(/(\d{1,2})(?::(\d{2}))?/);
      if (!match) return "";
      let hour = Math.min(24, Number(match[1]));
      let minute = match[2] ? Number(match[2]) : 0;
      if (hour === 24) return "24:00";
      minute = minute >= 30 ? 30 : 0;
      return String(hour).padStart(2, "0") + ":" + String(minute).padStart(2, "0");
    }
    function fillTimes(select, selected) {
      select.innerHTML = timeOptions().map((value) => {
        const label = value || ("선택" + (tr("선택") ? " / " + tr("선택") : ""));
        return '<option value="' + value + '"' + (value === selected ? " selected" : "") + ">" + label + "</option>";
      }).join("");
    }
    function splitSlot(slot) {
      const parts = String(slot || "").split("~");
      return [snapTime(parts[0]), snapTime(parts[1])];
    }
    function monthOption(n) {
      const extra = state.lang === "vi" ? " / " + n + " tháng" : state.lang === "my" ? " / " + n + " လ" : "";
      return '<option value="' + n + '">' + n + "개월" + extra + "</option>";
    }
    monthsEl.innerHTML = Array.from({ length: 37 }, (_, n) => monthOption(n)).join("");

      if (subMin > 0) lines.push(["대체근무", formatMinutes(subMin) + " · 시급 10,320원", won(subMin, base)]);
      if (extraMin > 0) lines.push(["추가근무", formatMinutes(extraMin) + " · 시급 10,320원", won(extraMin, base)]);
      if (shortMin > 0) lines.push(["단축근무", formatMinutes(shortMin) + " · 시급 10,320원", -won(shortMin, base)]);
      if (lateMin > 0) lines.push(["지각", formatMinutes(lateMin) + " · 시급 10,320원", -won(lateMin, base)]);
      const total = lines.reduce((sum, line) => sum + line[2], 0);
      return { lines, total };
    }
    function trunc10(value) { return Math.floor(Math.max(0, value) / 10) * 10; }
    function takeHome(gross, months) {
      const base = Math.max(0, Math.round(gross));
      const employment = months >= 4 ? trunc10(base * 0.009) : 0;
      const income = base <= 2000000 ? 0 : trunc10((base - 2000000) * 0.04);
      const local = trunc10(income * 0.1);
      return { employment, income, local, insured: months >= 4, net: base - (employment + income + local) };
    }
    function payLines() {
      const pay = calcGross(days());
      const take = takeHome(pay.total, state.months);
      const won = (value) => value.toLocaleString("ko-KR") + "원";
      return [state.months + "개월차"].concat(pay.lines.map((line) => line[0] + " " + won(line[2]))).concat([
        "세전 " + won(pay.total),
        "국민연금 해당없음",
        "건강보험 해당없음",
        "장기요양 해당없음",
        take.insured ? "고용보험 " + won(take.employment) : "고용보험 해당없음",
        "소득세 " + won(take.income),
        "지방소득세 " + won(take.local),
        "세후 " + won(take.net),
      ]);
    }
    function showPay() {
      const pay = calcGross(days());
      const take = takeHome(pay.total, state.months);
      const won = (value) => value.toLocaleString("ko-KR") + "원";
      const rows = pay.lines.map((line) =>
        '<div class="row" style="align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:.5rem"><div><p style="font-weight:600;font-size:.875rem;margin:0">' + line[0] + '</p><p class="muted" style="margin:.15rem 0 0">' + line[1] + '</p></div><p style="font-weight:600;margin:0">' + won(line[2]) + "</p></div>"
      ).join("");
      const cuts = [
        ["국민연금", "해당없음"],
        ["건강보험", "해당없음"],
        ["장기요양", "해당없음"],
        ["고용보험", take.insured ? "-" + won(take.employment) : "해당없음"],
        ["소득세", "-" + won(take.income)],
        ["지방소득세", "-" + won(take.local)],
      ].map((item) => '<p class="row"><span>' + item[0] + "</span><span>" + item[1] + "</span></p>").join("");
      const sheet = document.getElementById("send-sheet");
      sheet.classList.remove("hidden");
      sheet.innerHTML =
        '<div class="sheet" role="dialog"><div class="row"><h2>' + state.month + '월 급여</h2><button class="icon" id="close-pay" type="button">✕</button></div>' +
        '<p class="muted">' + state.months + '개월차. 고용보험은 4개월차부터. 국민연금·건강보험·장기요양은 빼지 않습니다.</p>' +
        rows +
        '<p class="row" style="font-weight:700"><span>세전</span><span>' + won(pay.total) + "</span></p>" +
        cuts +
        '<p class="row" style="font-weight:700;color:var(--primary)"><span>세후</span><span>' + won(take.net) + "</span></p></div>";
      document.getElementById("close-pay").onclick = () => sheet.classList.add("hidden");
      sheet.onclick = (event) => { if (event.target.id === "send-sheet") sheet.classList.add("hidden"); };
    }
    document.getElementById("open-send").onclick = async () => {
      if (!validPhone(state.phone)) {
        const message = "점장 전화번호를 입력하세요.";
        document.getElementById("phone-error").textContent = message + (tr(message) ? " " + tr(message) : "");
        phoneEl.focus();
        return;
      }
      const blob = await calendarBlob();
      const url = URL.createObjectURL(blob);
      const sheet = document.getElementById("send-sheet");
      sheet.classList.remove("hidden");
      sheet.innerHTML =
        '<div class="sheet" role="dialog"><div class="row"><h2>' + state.year + "년 " + state.month + '월 전송</h2><button class="icon" id="close-send" type="button">✕</button></div>' +
        '<p>받는 점장 ' + state.phone + "</p>" +
        '<div style="max-height:16rem;overflow:auto"><img class="preview" alt="근무 달력" src="' + url + '"></div>' +
        '<div class="actions"><button class="kakao" id="kakao" type="button">카카오톡</button><button class="sms" id="sms" type="button">문자</button></div>' +
        '<p id="notice" class="muted"></p></div>';
      document.getElementById("close-send").onclick = () => { sheet.classList.add("hidden"); URL.revokeObjectURL(url); };
      sheet.onclick = (event) => { if (event.target.id === "send-sheet") document.getElementById("close-send").click(); };
      async function share(channel) {
        const file = new File([blob], state.year + "년" + state.month + "월-근무내역.png", { type: "image/png" });
        const text = [state.worker && "근무자 " + state.worker + " " + state.months + "개월차", state.slot && "시간대 " + state.slot, state.year + "년 " + state.month + "월 급여", payLines().join("\n")].filter(Boolean).join("\n");
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file], title: text, text });
            showPay();
            return;
          } catch (error) {
            if (error && error.name === "AbortError") return;
          }
        }
        const link = document.createElement("a");
        link.href = url;
        link.download = file.name;
        link.click();
        showPay();
      }
      document.getElementById("kakao").onclick = () => share("kakao");
      document.getElementById("sms").onclick = () => share("sms");
    };
    render();
  </script>
</body>
</html>
