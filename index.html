<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>근무내역</title>
  <script>
    (function () {
      var ua = navigator.userAgent || "";
      if (!/kakaotalk/i.test(ua)) return;
      var url = location.href.split("#")[0];
      location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(url);
      if (/android/i.test(ua)) {
        setTimeout(function () {
          var bare = url.replace(/^https?:\/\//i, "");
          location.href = "intent://" + bare + "#Intent;scheme=https;package=com.android.chrome;end";
        }, 700);
      }
    })();
  </script>
  <style>
    :root {
      --bg: #f3efe6;
      --surface: #fffdf8;
      --fg: #1c1915;
      --muted: #746c62;
      --line: #e4dccf;
      --primary: #1b6b45;
      --primary-fg: #f7fbf8;
      --tint: #e7f3ec;
      --sun: #8c3d32;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    }
    main { max-width: 32rem; margin: 0 auto; padding: 1.5rem 1rem 7rem; }
    header { display: block; margin-bottom: 0.75rem; }
    h1 { margin: 0; font-size: 1.5rem; }
    .muted { color: var(--muted); font-size: 0.875rem; margin: 0; }
    .month { display: flex; align-items: center; justify-content: space-between; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 0.25rem; margin-bottom: 0.75rem; }
    .month p { flex: 1; text-align: center; font-size: 1.125rem; font-weight: 700; margin: 0; }
    button, input { font: inherit; }
    .icon {
      width: 2.75rem; height: 2.75rem; border: 0; background: transparent; border-radius: 999px; cursor: pointer;
    }
    label.field { display: flex; flex-direction: column; gap: 0.25rem; margin-bottom: 0.5rem; }
    label.field span { font-size: 0.875rem; font-weight: 600; }
    .guide, .notice {
      margin: 0.35rem 0 0.6rem; padding: 0.55rem 0.7rem; border-radius: 0.75rem;
      background: #8c3d32; color: #fffdf8; font-size: 0.95rem; font-weight: 700; line-height: 1.35;
    }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
    input[type="text"], input[type="tel"], input[type="number"] {
      height: 2.75rem; border: 1px solid var(--line); background: var(--surface); border-radius: 0.75rem; padding: 0 0.75rem; width: 100%;
    }
    .sec { border-radius: 0.9rem; padding: 0.65rem 0.7rem 0.2rem; margin-bottom: 0.55rem; }
    .sec h3 { margin: 0 0 0.45rem; font-size: 0.95rem; }
    .sec.type { background: #e7f3ec; border: 2px solid #1b6b45; }
    .sec.type h3 { color: #145c38; }
    .sec.time { background: #fff4d6; border: 2px solid #9a6b12; }
    .sec.time h3 { color: #7a5208; }
    .sec.extra { background: #f8e8e4; border: 2px solid #8c3d32; }
    .sec.extra .choice.on { border-color: #8c3d32; background: #fffdf8; color: #8c3d32; }
    .day-grid { display: grid; gap: 0.5rem; }
    @media (orientation: landscape) and (max-height: 520px) {
      main {
        max-width: none; display: grid;
        grid-template-columns: minmax(220px, 320px) minmax(0, 1fr);
        column-gap: 0.7rem; padding: 0.4rem 0.55rem 3.6rem; align-items: start;
      }
      header, .month, .topfields, .notice, .reset, .summary { grid-column: 1; }
      .cal { grid-column: 2; grid-row: 1 / span 12; margin: 0; }
      header { margin-bottom: 0.25rem; }
      h1 { font-size: 1.15rem; }
      header .muted { display: none; }
      .month { margin-bottom: 0.3rem; }
      .icon { width: 2.1rem; height: 2.1rem; }
      label.field { margin-bottom: 0.25rem; }
      input[type="text"], input[type="tel"], input[type="number"] { height: 2.15rem; }
      .day { min-height: 2.35rem; padding: 0.15rem; }
      .wd { padding: 0.2rem 0; }
      .reset { height: 2.2rem; margin-bottom: 0.35rem; }
      .sheet { width: min(52rem, 100%); }
      .day-grid { grid-template-columns: 1fr 1fr; }
      .choice, .hours { min-height: 2.2rem; margin-bottom: 0.35rem; }
    }
    .summary { font-size: 0.875rem; line-height: 1.5rem; color: var(--muted); margin: 0 0 0.75rem; }
    .cal { border: 1px solid var(--line); background: var(--surface); border-radius: 1rem; padding: 0.5rem; margin: 0 0 0.75rem; }
    .grid { display: grid; grid-template-columns: repeat(7, 1fr); }
    .wd { text-align: center; font-size: 0.75rem; font-weight: 600; padding: 0.5rem 0; color: var(--muted); }
    .wd.sun { color: var(--sun); }
    .day { min-width: 0; min-height: 4.25rem; border: 0; background: transparent; border-radius: 0.75rem; text-align: left; padding: 0.25rem; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; overflow: hidden; }
    .day.on { background: var(--tint); }
    .day.today { box-shadow: inset 0 0 0 1px var(--primary); }
    .day b { font-size: 0.875rem; }
    .day b.sun { color: var(--sun); }
    .day .type { color: var(--primary); font-size: 0.75rem; font-weight: 600; }
    .day .sub { color: var(--muted); font-size: 0.7rem; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .send {
      position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; padding: 0 1rem 1rem;
    }
    .send #open-send, .primary {
      width: min(32rem, 100%); height: 3rem; border: 0; border-radius: 999px; background: var(--primary); color: var(--primary-fg);
      font-weight: 600; cursor: pointer;
    }
    .reset {
      width: min(32rem, 100%); height: 2.75rem; border: 1px solid var(--line); border-radius: 999px;
      background: var(--surface); color: var(--fg); font-weight: 600; cursor: pointer; margin: 0 0 0.75rem;
    }
    .sheet-bg { position: fixed; inset: 0; background: rgba(28, 25, 21, 0.4); display: flex; align-items: flex-end; justify-content: center; }
    .sheet {
      width: min(32rem, 100%); max-height: 100dvh; overflow: auto; background: var(--surface);
      border: 1px solid var(--line); border-radius: 1.5rem 1.5rem 0 0; padding: 1rem 1rem 1.5rem;
    }
    .sheet h2 { margin: 0; font-size: 1.125rem; }
    .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
    .choice, .hours {
      width: 100%; min-height: 2.75rem; border: 1px solid var(--line); background: var(--surface); border-radius: 0.75rem;
      text-align: left; padding: 0 0.75rem; margin-bottom: 0.5rem; cursor: pointer;
    }
    .choice.on { border-color: var(--primary); background: var(--tint); color: var(--primary); }
    .hours { display: flex; align-items: center; justify-content: space-between; cursor: default; }
    .hours input { width: 5rem; border: 0; background: transparent; text-align: right; font-weight: 600; }
    #hours { width: 12rem; font-weight: 400; }
    .hours:disabled, .hours.off { opacity: 0.4; }
    .confirm { width: 100%; height: 3rem; border: 0; border-radius: 0.75rem; background: var(--primary); color: var(--primary-fg); font-weight: 600; margin-top: 1rem; cursor: pointer; }
    .confirm:disabled { opacity: 0.4; }
    .ghost { width: 100%; height: 2.75rem; border: 0; background: transparent; color: var(--muted); margin-top: 0.5rem; cursor: pointer; }
    .err { color: var(--sun); font-size: 0.875rem; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 0.75rem; }
    .actions button { height: 3rem; border-radius: 0.75rem; font-weight: 600; cursor: pointer; }
    .kakao { border: 0; background: var(--primary); color: var(--primary-fg); }
    .sms { border: 1px solid var(--line); background: var(--surface); }
    img.preview { width: 100%; border: 1px solid var(--line); border-radius: 0.75rem; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="muted">점장에게 카톡·문자로 전송</p>
      <h1>근무내역</h1>
    </header>
    <div class="month">
      <button class="icon" id="prev" type="button" aria-label="이전달">‹</button>
      <p id="month-label"></p>
      <button class="icon" id="next" type="button" aria-label="다음달">›</button>
    </div>
    <p class="notice">※ 달력에서 날짜와 근무 시간대를 입력하세요</p>
    <div class="topfields">
      <label class="field"><span>점장 전화번호</span><input id="phone" type="tel" inputmode="tel" placeholder="010-0000-0000"></label>
      <p id="phone-error" class="err"></p>
      <label class="field"><span>근무자 이름</span><input id="worker" type="text" placeholder="이름"></label>
      <div class="pair">
        <label class="field"><span>근무개월수</span><input id="months" type="number" min="0" step="1" inputmode="numeric" placeholder="개월"></label>
        <label class="field"><span>근무시간대</span><input id="slot" type="text" placeholder="06시~12시"></label>
      </div>
    </div>
    <button id="reset-all" class="reset" type="button">전체 새로고침</button>
    <p id="summary" class="summary"></p>
    <section class="cal"><div id="cal" class="grid"></div></section>
  </main>
  <div class="send"><button id="open-send" type="button">달력 이미지로 전송</button></div>
  <div id="day-sheet" class="sheet-bg hidden"></div>
  <div id="send-sheet" class="sheet-bg hidden"></div>
  <script>
    const TYPES = [
      { id: "edu", label: "2인 근무 교육", short: "교육" },
      { id: "prob", label: "1인 근무 수습", short: "수습" },
      { id: "full", label: "1인 근무 정식", short: "정식" },
      { id: "sub", label: "대체근무", short: "대체" },
    ];
    const WEEK = ["일", "월", "화", "수", "목", "금", "토"];
    const STORE_KEY = "work-log-v1";
    const now = new Date();
    const state = {
      year: now.getFullYear(),
      month: now.getMonth() + 1,
      phone: localStorage.getItem("work-log-manager-phone") || "",
      worker: localStorage.getItem("work-log-worker-name") || "",
      months: Number(localStorage.getItem("work-log-worker-months")) || 0,
      slot: localStorage.getItem("work-log-shift") || "",
      store: {},
      picked: null,
      draft: null,
    };
    try { state.store = JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); } catch { state.store = {}; }
    const today = new Date();
    const todayKey = today.getFullYear() + "-" + (today.getMonth() + 1) + "-" + today.getDate();

    const phoneEl = document.getElementById("phone");
    const workerEl = document.getElementById("worker");
    const monthsEl = document.getElementById("months");
    const slotEl = document.getElementById("slot");
    phoneEl.value = state.phone;
    workerEl.value = state.worker;
    monthsEl.value = state.months || "";
    slotEl.value = state.slot;

    function save() {
      localStorage.setItem(STORE_KEY, JSON.stringify(state.store));
      localStorage.setItem("work-log-manager-phone", state.phone);
      localStorage.setItem("work-log-worker-name", state.worker);
      localStorage.setItem("work-log-worker-months", String(state.months));
      localStorage.setItem("work-log-shift", state.slot);
    }
    function key() { return state.year + "-" + state.month; }
    function cleanRec(rec) {
      if (!rec || typeof rec !== "object") return null;
      const type = TYPES.some((item) => item.id === rec.type) ? rec.type : null;
      const late = !!rec.late;
      const absent = !!rec.absent;
      const off = !!rec.off || rec.type === "off";
      const hours = rec.hours == null || rec.hours === "" ? null : Number(rec.hours);
      const extra = rec.extra == null || rec.extra === "" ? null : Number(rec.extra);
      const short = rec.short == null || rec.short === "" ? null : Number(rec.short);
      if (!type && !late && !absent && !off && extra == null && short == null) return null;
      return { type, hours, extra, short, late, absent, off };
    }
    function marks(rec) {
      return [rec.late ? "지각" : "", rec.absent ? "결근" : "", rec.off ? "휴무" : ""].filter(Boolean).join(" ");
    }
    function days() {
      const raw = state.store[key()] || {};
      const next = {};
      Object.entries(raw).forEach(([day, rec]) => {
        const clean = cleanRec(rec);
        if (clean) next[day] = clean;
      });
      return next;
    }
    function meta(id) { return TYPES.find((item) => item.id === id); }
    function eduRest(hours) {
      if (hours <= 0) return 0;
      return (hours <= 1 ? hours : hours - 1) * 10;
    }
    function formatRest(minutes) {
      const total = Math.round(minutes);
      const h = Math.floor(total / 60);
      const m = total % 60;
      if (h && m) return h + "시간 " + m + "분";
      if (h) return h + "시간";
      return m + "분";
    }
    function validPhone(phone) { return /^01\d{8,9}$/.test(phone.replace(/\D/g, "")); }

    function render() {
      document.getElementById("month-label").textContent = state.year + "년 " + state.month + "월";
      const map = days();
      const counts = { edu: 0, prob: 0, full: 0, sub: 0 };
      let extra = 0, short = 0, eduRestSum = 0, late = 0, absent = 0, off = 0;
      Object.values(map).forEach((rec) => {
        if (!rec) return;
        if (rec.type) counts[rec.type] += rec.hours || 0;
        extra += rec.extra || 0;
        short += rec.short || 0;
        if (rec.type === "edu" && rec.hours != null) eduRestSum += eduRest(rec.hours);
        if (rec.late) late += 1;
        if (rec.absent) absent += 1;
        if (rec.off) off += 1;
      });
      let summary = "시간 " + TYPES.map((item) => item.short + " " + counts[item.id]).join(" · ");
      if (extra || short) summary += " · 추가 " + extra + " · 단축 " + short;
      if (eduRestSum) summary += " · 교육 휴게 " + formatRest(eduRestSum);
      if (late || absent || off) summary += " · 지각 " + late + " · 결근 " + absent + " · 휴무 " + off;
      document.getElementById("summary").textContent = summary;

      const lead = new Date(state.year, state.month - 1, 1).getDay();
      const total = new Date(state.year, state.month, 0).getDate();
      const cells = WEEK.map((label, index) => '<div class="wd' + (index === 0 ? " sun" : "") + '">' + label + "</div>").join("");
      let body = "";
      for (let i = 0; i < lead; i += 1) body += "<div></div>";
      for (let day = 1; day <= total; day += 1) {
        const rec = map[String(day)];
        const wd = new Date(state.year, state.month - 1, day).getDay();
        const isToday = todayKey === state.year + "-" + state.month + "-" + day;
        let inner = '<b class="' + (wd === 0 ? "sun" : "") + '">' + day + "</b>";
        if (rec) {
          if (rec.type) inner += '<span class="type">' + meta(rec.type).short + (rec.hours != null ? " " + rec.hours : "") + "</span>";
          if (rec.type === "edu" && rec.hours != null) inner += '<span class="sub">휴게 ' + Math.round(eduRest(rec.hours)) + "분</span>";
          if (marks(rec)) inner += '<span class="sub" style="color:#8c3d32;font-weight:700">' + marks(rec) + "</span>";
          if (rec.extra != null) inner += '<span class="sub">+' + rec.extra + "</span>";
          if (rec.short != null) inner += '<span class="sub">-' + rec.short + "</span>";
        }
        body += '<button type="button" class="day' + (rec ? " on" : "") + (isToday ? " today" : "") + '" data-day="' + day + '">' + inner + "</button>";
      }
      document.getElementById("cal").innerHTML = cells + body;
    }

    document.getElementById("cal").addEventListener("click", (event) => {
      const button = event.target.closest("[data-day]");
      if (!button) return;
      openDay(Number(button.dataset.day));
    });
    document.getElementById("prev").onclick = () => shift(-1);
    document.getElementById("next").onclick = () => shift(1);
    function shift(delta) {
      const next = new Date(state.year, state.month - 1 + delta, 1);
      state.year = next.getFullYear();
      state.month = next.getMonth() + 1;
      render();
    }
    phoneEl.oninput = () => { state.phone = phoneEl.value; document.getElementById("phone-error").textContent = ""; save(); };
    workerEl.oninput = () => { state.worker = workerEl.value; save(); };
    monthsEl.oninput = () => {
      const next = Number(monthsEl.value);
      state.months = Number.isFinite(next) && next > 0 ? Math.floor(next) : 0;
      save();
    };
    slotEl.oninput = () => { state.slot = slotEl.value; save(); };

    function openDay(day) {
      const existing = days()[String(day)];
      state.picked = day;
      state.draft = existing
        ? { type: existing.type, hours: existing.hours, extra: existing.extra, short: existing.short, late: !!existing.late, absent: !!existing.absent, off: !!existing.off }
        : { type: null, hours: null, extra: null, short: null, late: false, absent: false, off: false };
      drawDay();
    }
    function drawDay() {
      const day = state.picked;
      const draft = state.draft;
      const wd = WEEK[new Date(state.year, state.month - 1, day).getDay()];
      const choices = TYPES.map((item) => {
        const on = draft.type === item.id;
        return '<button type="button" class="choice' + (on ? " on" : "") + '" data-type="' + item.id + '">' + item.label + "</button>";
      }).join("");
      const flags = [["late", "지각"], ["absent", "결근"], ["off", "휴무"]].map((item) => {
        const on = draft[item[0]];
        return '<button type="button" class="choice' + (on ? " on" : "") + '" data-flag="' + item[0] + '">' + item[1] + "</button>";
      }).join("");
      const ready = !!(draft.type || draft.extra != null || draft.short != null || draft.late || draft.absent || draft.off);
      const rest = draft.type === "edu" && draft.hours != null
        ? '<p class="muted">휴게 ' + formatRest(eduRest(draft.hours)) + (draft.hours > 1 ? " · 마지막 1시간은 휴게 없음" : "") + "</p>"
        : "";
      document.getElementById("day-sheet").classList.remove("hidden");
      document.getElementById("day-sheet").innerHTML =
        '<div class="sheet" role="dialog">' +
        '<div class="row"><h2>' + state.month + "월 " + day + "일 " + wd + '요일</h2><button class="icon" id="close-day" type="button" aria-label="닫기">✕</button></div>' +
        '<div class="day-grid">' +
        '<section class="sec type"><h3>근무 유형 하나만 선택</h3>' + choices + '</section>' +
        '<div><section class="sec time"><h3>근무 시간 입력</h3>' +
        '<label class="hours' + (draft.type ? "" : " off") + '">근무 시간<input id="hours" type="number" min="0" step="0.5" placeholder="근무시간을 적으세요" ' + (draft.type ? "" : "disabled") + ' value="' + (draft.hours ?? "") + '"></label>' +
        rest + '</section>' +
        '<section class="sec extra"><h3>추가 선택</h3>' +
        '<label class="hours">추가근무<input id="extra" type="number" min="0" step="0.5" placeholder="시간" value="' + (draft.extra ?? "") + '"></label>' +
        '<label class="hours">단축근무<input id="short" type="number" min="0" step="0.5" placeholder="시간" value="' + (draft.short ?? "") + '"></label>' +
        flags +
        '</section></div></div>' +
        '<button class="confirm" id="confirm" type="button"' + (ready ? "" : " disabled") + ">확인</button>" +
        '<button class="ghost" id="clear" type="button">이 날짜 지우기</button></div>';
      document.getElementById("close-day").onclick = closeDay;
      document.getElementById("day-sheet").onclick = (event) => { if (event.target.id === "day-sheet") closeDay(); };
      document.querySelectorAll("[data-type]").forEach((button) => {
        button.onclick = () => { state.draft.type = button.dataset.type; drawDay(); };
      });
      document.querySelectorAll("[data-flag]").forEach((button) => {
        button.onclick = () => { state.draft[button.dataset.flag] = !state.draft[button.dataset.flag]; drawDay(); };
      });
      bindHours("hours", "hours");
      bindHours("extra", "extra");
      bindHours("short", "short");
      document.getElementById("confirm").onclick = confirmDay;
      document.getElementById("clear").onclick = () => {
        const map = { ...days() };
        delete map[String(state.picked)];
        state.store[key()] = map;
        save();
        closeDay();
        render();
      };
    }
    function bindHours(id, field) {
      const input = document.getElementById(id);
      input.oninput = () => {
        const raw = input.value;
        state.draft[field] = raw === "" ? null : Math.max(0, Number(raw));
        if (field === "hours" && state.draft.type === "edu") drawDay();
      };
    }
    function confirmDay() {
      const draft = state.draft;
      if (!(draft.type || draft.extra != null || draft.short != null || draft.late || draft.absent || draft.off)) return;
      const map = { ...days() };
      map[String(state.picked)] = {
        type: draft.type,
        hours: draft.type ? draft.hours : null,
        extra: draft.extra,
        short: draft.short,
        late: !!draft.late,
        absent: !!draft.absent,
        off: !!draft.off,
      };
      state.store[key()] = map;
      save();
      closeDay();
      render();
    }
    function closeDay() {
      state.picked = null;
      state.draft = null;
      document.getElementById("day-sheet").classList.add("hidden");
    }

    function calendarBlob() {
      const width = 780;
      const pad = 24;
      const lead = new Date(state.year, state.month - 1, 1).getDay();
      const total = new Date(state.year, state.month, 0).getDate();
      const rows = Math.ceil((lead + total) / 7);
      const cellH = 118;
      const weekH = 28;
      const headerLines = ["점장 " + state.phone, state.worker ? "근무자 " + state.worker + (state.months ? " " + state.months + "개월차" : "") : "", state.slot ? "시간대 " + state.slot : ""].filter(Boolean);
      const statement = payLines();
      const head = 48 + headerLines.length * 22;
      const foot = 36 + statement.length * 22;
      const height = pad + head + weekH + rows * cellH + foot + pad;
      const canvas = document.createElement("canvas");
      const scale = 2;
      canvas.width = width * scale;
      canvas.height = height * scale;
      const ctx = canvas.getContext("2d");
      ctx.scale(scale, scale);
      const font = '"Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif';
      ctx.fillStyle = "#f3efe6";
      ctx.fillRect(0, 0, width, height);
      ctx.fillStyle = "#1c1915";
      ctx.font = "600 28px " + font;
      ctx.fillText(state.year + "년 " + state.month + "월 근무내역", pad, pad + 32);
      ctx.fillStyle = "#746c62";
      ctx.font = "500 16px " + font;
      headerLines.forEach((line, index) => ctx.fillText(line, pad, pad + 58 + index * 22));
      const gridTop = pad + head;
      const cellW = (width - pad * 2) / 7;
      ctx.font = "600 13px " + font;
      ctx.textAlign = "center";
      WEEK.forEach((label, i) => {
        ctx.fillStyle = i === 0 ? "#8c3d32" : "#746c62";
        ctx.fillText(label, pad + cellW * i + cellW / 2, gridTop + 16);
      });
      ctx.textAlign = "left";
      const originY = gridTop + weekH;
      roundRect(ctx, pad, originY, width - pad * 2, rows * cellH, 16);
      ctx.fillStyle = "#fffdf8";
      ctx.fill();
      const map = days();
      for (let index = 0; index < lead + total; index += 1) {
        if (index < lead) continue;
        const col = index % 7;
        const row = Math.floor(index / 7);
        const x = pad + col * cellW;
        const y = originY + row * cellH;
        const day = index - lead + 1;
        const rec = map[String(day)];
        if (rec) {
          ctx.fillStyle = "#e7f3ec";
          ctx.fillRect(x + 4, y + 4, cellW - 8, cellH - 8);
        }
        ctx.fillStyle = col === 0 ? "#8c3d32" : "#1c1915";
        ctx.font = "600 16px " + font;
        ctx.fillText(String(day), x + 8, y + 20);
        if (!rec) continue;
        ctx.fillStyle = "#1b6b45";
        ctx.font = "600 12px " + font;
        if (rec.type) ctx.fillText(meta(rec.type).short + (rec.hours != null ? " " + rec.hours : ""), x + 8, y + 42);
        let extraY = 60;
        if (rec.type === "edu" && rec.hours != null) {
          ctx.fillStyle = "#746c62";
          ctx.font = "500 11px " + font;
          ctx.fillText("휴게 " + Math.round(eduRest(rec.hours)) + "분", x + 8, y + 58);
          extraY = 76;
        }
        if (marks(rec)) {
          ctx.fillStyle = "#8c3d32";
          ctx.font = "600 11px " + font;
          ctx.fillText(marks(rec), x + 8, y + 100);
        }
        ctx.font = "500 12px " + font;
        if (rec.extra != null) {
          ctx.fillStyle = "#1c1915";
          ctx.fillText("+" + rec.extra, x + 8, y + extraY);
        }
        if (rec.short != null) {
          ctx.fillStyle = "#746c62";
          ctx.fillText("-" + rec.short, x + 8, y + extraY + (rec.extra != null ? 16 : 0));
        }
      }
      const payTop = originY + rows * cellH + 28;
      statement.forEach((line, index) => {
        const strong = line.indexOf("세전") === 0 || line.indexOf("세후") === 0;
        ctx.fillStyle = strong ? "#1b6b45" : "#1c1915";
        ctx.font = (strong ? "700 " : "500 ") + "16px " + font;
        ctx.fillText(line, pad, payTop + index * 22);
      });
      return new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
    }
    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    document.getElementById("reset-all").onclick = () => {
      if (!confirm("달력에 입력한 근무내역만 모두 지울까요?")) return;
      state.store = {};
      state.picked = null;
      state.draft = null;
      document.getElementById("day-sheet").classList.add("hidden");
      document.getElementById("send-sheet").classList.add("hidden");
      save();
      render();
    };
    function won(minutes, wage) { return Math.round((minutes / 60) * wage); }
    function formatMinutes(minutes) {
      const total = Math.max(0, Math.round(minutes));
      const hours = Math.floor(total / 60);
      const mins = total % 60;
      if (hours && mins) return hours + "시간 " + mins + "분";
      if (hours) return hours + "시간";
      return mins + "분";
    }
    function calcGross(map) {
      const base = 10320;
      const probation = 9288;
      let eduMin = 0, eduRestSum = 0, probMin = 0, fullMin = 0, subMin = 0, extraMin = 0, shortMin = 0;
      Object.values(map).forEach((rec) => {
        if (!rec) return;
        const minutes = Math.round((rec.hours || 0) * 60);
        if (rec.type === "edu") {
          eduMin += minutes;
          if ((rec.hours || 0) > 0) eduRestSum += eduRest(rec.hours);
        } else if (rec.type === "prob") probMin += minutes;
        else if (rec.type === "full") fullMin += minutes;
        else if (rec.type === "sub") subMin += minutes;
        extraMin += Math.round((rec.extra || 0) * 60);
        shortMin += Math.round((rec.short || 0) * 60);
      });
      const lines = [];
      const eduPaid = Math.max(0, eduMin - eduRestSum);
      if (eduPaid > 0) lines.push(["2인 근무 교육", formatMinutes(eduPaid) + " · 휴게 " + formatRest(eduRestSum) + " 제외 · 수습 9,288원", won(eduPaid, probation)]);
      if (probMin > 0) lines.push(["1인 근무 수습", formatMinutes(probMin) + " · 수습 9,288원", won(probMin, probation)]);
      if (fullMin > 0) lines.push(["1인 근무 정식", formatMinutes(fullMin) + " · 시급 10,320원", won(fullMin, base)]);
      if (subMin > 0) lines.push(["대체근무", formatMinutes(subMin) + " · 시급 10,320원", won(subMin, base)]);
      if (extraMin > 0) lines.push(["추가근무", formatMinutes(extraMin) + " · 시급 10,320원", won(extraMin, base)]);
      if (shortMin > 0) lines.push(["단축근무", formatMinutes(shortMin) + " · 시급 10,320원", -won(shortMin, base)]);
      const total = lines.reduce((sum, line) => sum + line[2], 0);
      return { lines, total };
    }
    function trunc10(value) { return Math.floor(Math.max(0, value) / 10) * 10; }
    function takeHome(gross, months) {
      const base = Math.max(0, Math.round(gross));
      const employment = months >= 4 ? trunc10(base * 0.009) : 0;
      const income = base <= 2000000 ? 0 : trunc10((base - 2000000) * 0.04);
      const local = trunc10(income * 0.1);
      return { employment, income, local, insured: months >= 4, net: base - (employment + income + local) };
    }
    function payLines() {
      const pay = calcGross(days());
      const take = takeHome(pay.total, state.months);
      const won = (value) => value.toLocaleString("ko-KR") + "원";
      return [state.months + "개월차"].concat(pay.lines.map((line) => line[0] + " " + won(line[2]))).concat([
        "세전 " + won(pay.total),
        "국민연금 해당없음",
        "건강보험 해당없음",
        "장기요양 해당없음",
        take.insured ? "고용보험 " + won(take.employment) : "고용보험 해당없음",
        "소득세 " + won(take.income),
        "지방소득세 " + won(take.local),
        "세후 " + won(take.net),
      ]);
    }
    function showPay() {
      const pay = calcGross(days());
      const take = takeHome(pay.total, state.months);
      const won = (value) => value.toLocaleString("ko-KR") + "원";
      const rows = pay.lines.map((line) =>
        '<div class="row" style="align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:.5rem"><div><p style="font-weight:600;font-size:.875rem;margin:0">' + line[0] + '</p><p class="muted" style="margin:.15rem 0 0">' + line[1] + '</p></div><p style="font-weight:600;margin:0">' + won(line[2]) + "</p></div>"
      ).join("");
      const cuts = [
        ["국민연금", "해당없음"],
        ["건강보험", "해당없음"],
        ["장기요양", "해당없음"],
        ["고용보험", take.insured ? "-" + won(take.employment) : "해당없음"],
        ["소득세", "-" + won(take.income)],
        ["지방소득세", "-" + won(take.local)],
      ].map((item) => '<p class="row"><span>' + item[0] + "</span><span>" + item[1] + "</span></p>").join("");
      const sheet = document.getElementById("send-sheet");
      sheet.classList.remove("hidden");
      sheet.innerHTML =
        '<div class="sheet" role="dialog"><div class="row"><h2>' + state.month + '월 급여</h2><button class="icon" id="close-pay" type="button">✕</button></div>' +
        '<p class="muted">' + state.months + '개월차. 고용보험은 4개월차부터. 국민연금·건강보험·장기요양은 빼지 않습니다.</p>' +
        rows +
        '<p class="row" style="font-weight:700"><span>세전</span><span>' + won(pay.total) + "</span></p>" +
        cuts +
        '<p class="row" style="font-weight:700;color:var(--primary)"><span>세후</span><span>' + won(take.net) + "</span></p></div>";
      document.getElementById("close-pay").onclick = () => sheet.classList.add("hidden");
      sheet.onclick = (event) => { if (event.target.id === "send-sheet") sheet.classList.add("hidden"); };
    }
    document.getElementById("open-send").onclick = async () => {
      if (!validPhone(state.phone)) {
        document.getElementById("phone-error").textContent = "점장 전화번호를 입력하세요.";
        phoneEl.focus();
        return;
      }
      const blob = await calendarBlob();
      const url = URL.createObjectURL(blob);
      const sheet = document.getElementById("send-sheet");
      sheet.classList.remove("hidden");
      sheet.innerHTML =
        '<div class="sheet" role="dialog"><div class="row"><h2>' + state.year + "년 " + state.month + '월 전송</h2><button class="icon" id="close-send" type="button">✕</button></div>' +
        '<p>받는 점장 ' + state.phone + "</p>" +
        '<div style="max-height:16rem;overflow:auto"><img class="preview" alt="근무 달력" src="' + url + '"></div>' +
        '<div class="actions"><button class="kakao" id="kakao" type="button">카카오톡</button><button class="sms" id="sms" type="button">문자</button></div>' +
        '<p id="notice" class="muted"></p></div>';
      document.getElementById("close-send").onclick = () => { sheet.classList.add("hidden"); URL.revokeObjectURL(url); };
      sheet.onclick = (event) => { if (event.target.id === "send-sheet") document.getElementById("close-send").click(); };
      async function share(channel) {
        const file = new File([blob], state.year + "년" + state.month + "월-근무내역.png", { type: "image/png" });
        const text = [state.worker && "근무자 " + state.worker + " " + state.months + "개월차", state.slot && "시간대 " + state.slot, state.year + "년 " + state.month + "월 급여", payLines().join("\n")].filter(Boolean).join("\n");
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file], title: text, text });
            showPay();
            return;
          } catch (error) {
            if (error && error.name === "AbortError") return;
          }
        }
        const link = document.createElement("a");
        link.href = url;
        link.download = file.name;
        link.click();
        showPay();
      }
      document.getElementById("kakao").onclick = () => share("kakao");
      document.getElementById("sms").onclick = () => share("sms");
    };
    render();
  </script>
</body>
